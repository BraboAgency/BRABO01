version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brabo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/brabo
      JWT_SECRET: super-secret
      PORT: 3001
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    ports:
      - "3001:3001"

  frontend:
    build: ../frontend
    env_file:
      - ../frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
